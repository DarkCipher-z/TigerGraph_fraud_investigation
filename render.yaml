# Render Blueprint - TigerGraph Fraud Investigation Dashboard
services:
  - type: web
    name: tigergraph-fraud-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run dashboard/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: TG_USE_MOCK
        value: "true"
    plan: free
